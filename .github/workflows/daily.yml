name: Daily NBA fantasy build

# Triggered by an external pinger (cron-job.org, America/New_York time) through the
# workflow_dispatch API, because GitHub's own schedule started runs 5-9 hours late:
#   slot=always   12:01 AM, and hourly 11:17 AM - 10:17 PM
#   slot=pregame  :15 and :45, 11 AM - 10 PM; builds only if a game tips off within
#                 30 min (pregame.py), i.e. ~15 min before each tip-off
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "always = build now; pregame = build only if a game tips off soon"
        default: always

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/New_York
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: gate
        if: inputs.slot == 'pregame'
        run: python3 pregame.py
      - uses: actions/setup-python@v7
        if: inputs.slot != 'pregame' || steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"
      - if: inputs.slot != 'pregame' || steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: inputs.slot != 'pregame' || steps.gate.outputs.run == 'true'
        run: python build.py
      - name: Commit data
        if: inputs.slot != 'pregame' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/games
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date '+%Y-%m-%d %H:%M')"
          git push
