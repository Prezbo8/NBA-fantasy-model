name: Daily NBA fantasy build

# Twice a day: early morning (overnight box scores) and late afternoon (pre-game injury news).
# UTC 11:17 / 22:17 = 6:17a / 5:17p EST (7:17a / 6:17p EDT). Not on the hour: GitHub
# drops/delays top-of-hour scheduled runs under load.
on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/New_York
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/games
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date '+%Y-%m-%d %H:%M')"
          git push
